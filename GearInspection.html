<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear Inspection — SFD</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --red:#b81c1c;
    --red-dark:#8f1212;
    --red-light:#fdf1f1;
    --green:#2f7d32;
    --green-light:#edf7ed;
    --fail:#b81c1c;
    --fail-light:#fff0f0;
    --grey:#3d3d3d;
    --grey-mid:#5c5c5c;
    --grey-light:#f4f4f4;
    --rule:#ddd;
    --text:#1e1e1e;
    --muted:#777;
    --white:#ffffff;
    --bg:#e8e8e8;
    --gold:#c8a84b;
  }
  body {
    font-family:'DM Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:32px 20px 100px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .page { width:100%; max-width:920px; }

  .doc-header {
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
    background:linear-gradient(135deg,#6b0f0f 0%,var(--red-dark) 50%,#6b0f0f 100%);
    border-radius:12px;
    padding:18px 24px;
    color:var(--white);
    border:2px solid rgba(200,168,75,.35);
    box-shadow:0 4px 24px rgba(143,18,18,.35);
  }
  .logo-wrap {
    width:72px;
    height:72px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-wrap img { width:100%; height:100%; object-fit:contain; }
  .doc-header-text { flex:1; }
  .agency {
    font-size:10px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:3px;
  }
  .doc-title { font-size:24px; font-weight:700; color:var(--white); line-height:1.1; }
  .doc-subtitle { font-size:11px; color:rgba(255,255,255,.60); margin-top:2px; letter-spacing:.04em; }
  .doc-meta {
    font-family:'DM Mono',monospace;
    font-size:11px;
    color:rgba(255,255,255,.70);
    text-align:right;
    line-height:1.9;
    flex-shrink:0;
  }

  .card {
    background:var(--white);
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    margin-bottom:14px;
    border:1px solid var(--rule);
    overflow:hidden;
  }
  .card-head {
    background:var(--grey);
    color:var(--white);
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-left:4px solid var(--red);
  }
  .card-head-left { display:flex; align-items:center; gap:10px; }
  .card-head .ico { font-size:15px; }
  .card-head h2 { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .card-count { font-family:'DM Mono',monospace; font-size:10px; color:rgba(255,255,255,.70); }
  .card-body { padding:16px 20px; }

  .fields { display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
  .field { padding:10px 0; border-bottom:1px solid #eee; }
  .field.full { grid-column:1/-1; }
  .fl {
    font-size:9px;
    font-weight:700;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }
  .fv { font-size:13px; font-weight:500; color:var(--text); min-height:18px; }
  .fv.long { font-weight:400; line-height:1.55; white-space:pre-wrap; }

  .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .summary-box {
    border:1px solid var(--rule);
    border-radius:9px;
    background:var(--grey-light);
    padding:12px;
    text-align:center;
  }
  .summary-num { font-family:'DM Mono',monospace; font-size:24px; font-weight:700; line-height:1; }
  .summary-label { font-size:9px; font-weight:700; letter-spacing:.11em; color:var(--muted); text-transform:uppercase; margin-top:6px; }
  .summary-box.pass .summary-num { color:var(--green); }
  .summary-box.fail .summary-num { color:var(--fail); }

  .inspection-table { width:100%; border-collapse:collapse; font-size:13px; }
  .inspection-table thead tr { background:var(--grey-light); border-bottom:2px solid var(--rule); }
  .inspection-table th {
    padding:9px 12px;
    text-align:left;
    font-size:9px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .inspection-table th.c { text-align:center; }
  .inspection-table tbody tr { border-bottom:1px solid #eee; }
  .inspection-table tbody tr:last-child { border-bottom:none; }
  .inspection-table td { padding:10px 12px; color:var(--text); vertical-align:top; }
  .inspection-table td.c { text-align:center; }
  .inspection-table td.mono { font-family:'DM Mono',monospace; font-size:12px; }

  .pill {
    display:inline-block;
    min-width:54px;
    text-align:center;
    border-radius:999px;
    padding:3px 9px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    border:1px solid #d6d6d6;
    color:var(--muted);
    background:#f7f7f7;
  }
  .pill.pass { color:var(--green); background:var(--green-light); border-color:#b9ddb9; }
  .pill.fail { color:var(--fail); background:var(--fail-light); border-color:#f0b3b3; }
  .pill.blank { color:#999; background:#fafafa; border-color:#e5e5e5; }

  .asset-meta {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:12px;
  }
  .asset-meta .field {
    border:1px solid #eee;
    border-radius:8px;
    padding:10px 12px;
    background:#fafafa;
  }

  .note-box {
    margin-top:12px;
    border:1px solid #eee;
    border-left:4px solid var(--red);
    border-radius:8px;
    padding:12px;
    background:#fffafa;
  }

  .loading { padding:24px; text-align:center; color:var(--muted); font-size:13px; }
  .loading .spinner {
    width:20px;
    height:20px;
    border:2px solid #ddd;
    border-top-color:var(--red);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
    margin-bottom:8px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { padding:14px; color:#c0392b; font-size:13px; background:#fff5f5; border:1px solid #ffd7d7; border-radius:8px; }
  .muted { color:var(--muted); font-style:italic; }

  /* Attachments */
  .attach-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }
  .attach-item {
    display:flex;
    flex-direction:column;
    border:1px solid var(--rule);
    border-radius:8px;
    overflow:hidden;
    text-decoration:none;
    color:var(--text);
    background:var(--grey-light);
    transition:box-shadow .15s, transform .1s;
  }
  .attach-item:hover {
    box-shadow:0 4px 14px rgba(0,0,0,.14);
    transform:translateY(-1px);
  }
  .attach-thumb {
    width:100%;
    height:auto;
    max-height:340px;
    object-fit:contain;
    background:#1e1e1e;
    display:block;
  }
  .attach-icon {
    width:100%;
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    background:#e2e2e2;
  }
  .attach-name {
    font-size:12px;
    font-weight:600;
    padding:8px 10px 2px;
    word-break:break-word;
    line-height:1.3;
  }
  .attach-meta {
    font-size:10px;
    color:var(--muted);
    padding:0 10px 8px;
  }
  .attach-empty {
    font-size:12px;
    color:var(--muted);
  }

  .print-bar {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--white);
    border-top:1px solid var(--rule);
    padding:11px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    z-index:100;
    box-shadow:0 -4px 16px rgba(0,0,0,.08);
  }
  .btn-print, .btn-copy {
    color:var(--white);
    border:none;
    border-radius:7px;
    padding:10px 20px;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s, transform .1s;
  }
  .btn-print { background:var(--red); padding-left:28px; padding-right:28px; }
  .btn-copy { background:var(--grey); }
  .btn-print:hover { background:var(--red-dark); }
  .btn-copy:hover { background:#555; }
  .btn-print:active, .btn-copy:active { transform:scale(.97); }
  .print-hint { font-size:12px; color:var(--muted); }

  @media (max-width:760px) {
    body { padding:18px 12px 96px; }
    .doc-header { align-items:flex-start; padding:16px; }
    .logo-wrap { width:56px; height:56px; }
    .doc-meta { display:none; }
    .fields, .summary-grid, .asset-meta { grid-template-columns:1fr; }
    .inspection-table th, .inspection-table td { padding:8px 7px; }
  }

  @media print {
    body { background:white; padding:0; min-height:0; }
    .print-bar { display:none; }
    .card { box-shadow:none; border-radius:6px; page-break-inside:avoid; break-inside:avoid-page; }
    .card-head { background:var(--grey) !important; color:white !important; break-after:avoid-page; page-break-after:avoid; }
    .page { max-width:100%; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .doc-header { background:#8f1212 !important; }
    .summary-box, .asset-meta .field { background:#fafafa !important; }

    .attach-grid { display:block; }
    .attach-item {
      display:block;
      margin-bottom:16px;
      border:1px solid #ccc;
      page-break-inside:avoid;
      break-inside:avoid-page;
    }
    .attach-thumb {
      max-height:70vh;
      max-width:75%;
      width:auto;
      height:auto;
      margin:0 auto;
      display:block;
    }
    .attach-icon { height:80px; }
    #attachments-card { break-inside:auto; page-break-inside:auto; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="doc-header">
    <div class="logo-wrap">
      <img src="https://salisbury.maps.arcgis.com/sharing/rest/content/items/33492bb1f8584dca9449da8c155f936a/data" alt="Salisbury Fire Department">
    </div>
    <div class="doc-header-text">
      <div class="agency">City of Salisbury · Est. 1872</div>
      <div class="doc-title">Gear Inspection</div>
      <div class="doc-subtitle">Salisbury Fire Department</div>
    </div>
    <div class="doc-meta" id="doc-meta"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-head-left"><span class="ico">📋</span><h2>Inspection Details</h2></div>
    </div>
    <div class="card-body">
      <div class="fields">
        <div class="field">
          <div class="fl">Name</div>
          <div class="fv" id="f-name">—</div>
        </div>
        <div class="field">
          <div class="fl">Inspector</div>
          <div class="fv" id="f-inspector">—</div>
        </div>
        <div class="field">
          <div class="fl">Date of Inspection</div>
          <div class="fv" id="f-date">—</div>
        </div>
        <div class="field">
          <div class="fl">Email</div>
          <div class="fv" id="f-email">—</div>
        </div>
        <div class="field full">
          <div class="fl">Inspector Name / Signature</div>
          <div class="fv" id="f-signature">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-head-left"><span class="ico">📊</span><h2>Inspection Summary</h2></div>
    </div>
    <div class="card-body">
      <div class="summary-grid">
        <div class="summary-box pass">
          <div class="summary-num" id="summary-pass">0</div>
          <div class="summary-label">Passing Checks</div>
        </div>
        <div class="summary-box fail">
          <div class="summary-num" id="summary-fail">0</div>
          <div class="summary-label">Failing Checks</div>
        </div>
        <div class="summary-box">
          <div class="summary-num" id="summary-total">0</div>
          <div class="summary-label">Total Answered</div>
        </div>
      </div>
    </div>
  </div>

  <div id="inspection-sections">
    <div class="card">
      <div class="loading"><div class="spinner"></div><br>Loading inspection…</div>
    </div>
  </div>

  <div class="card" id="attachments-card" style="display:none;">
    <div class="card-head">
      <div class="card-head-left"><span class="ico">📎</span><h2>Attachments</h2></div>
    </div>
    <div class="card-body">
      <div class="attach-grid" id="f-attachments"></div>
    </div>
  </div>
</div>

<div class="print-bar">
  <button class="btn-copy" id="btn-copy" onclick="copyLink()">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
    </svg>
    Copy Link
  </button>
  <button class="btn-print" onclick="window.print()">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8" rx="1"/>
      <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
    </svg>
    Print / Save PDF
  </button>
</div>

<script>
const BASE = 'https://services6.arcgis.com/Hx8jJ6McXQ0jnqLk/arcgis/rest/services/service_efec036352bd43439efbc4ecb0c54d98/FeatureServer';
const PARENT_LAYER = BASE + '/0';

const p = new URLSearchParams(window.location.search);
const gid = p.get('globalid');

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function val(a, field) {
  const v = a ? a[field] : null;
  return v != null && String(v).trim() !== '' ? v : '';
}
function displayVal(a, field, fallback) {
  const v = val(a, field);
  return v !== '' ? v : (fallback || '—');
}
function setText(id, value, fallback) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = value != null && String(value).trim() !== '' ? value : (fallback || '—');
}
function fmtDate(epoch) {
  if (!epoch) return '';
  return new Date(epoch).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function getDate(a, field) {
  return val(a, field) ? fmtDate(a[field]) : '';
}
function passFailClass(value) {
  const v = String(value || '').toLowerCase().trim();
  if (v === 'pass') return 'pass';
  if (v === 'fail') return 'fail';
  return 'blank';
}
function passFailPill(value) {
  const clean = String(value || '').trim();
  const cls = passFailClass(clean);
  return '<span class="pill ' + cls + '">' + escapeHTML(clean || '—') + '</span>';
}
function prettySource(value) {
  const v = String(value || '').trim().toLowerCase();
  if (v === 'issued') return 'Issued';
  if (v === 'personal') return 'Personal';
  return value || '';
}
function sizeLabel(value) {
  const labels = {
    xxs:'XXS', xs:'XS', s:'Small', small:'Small',
    m:'Medium', medium:'Medium', l:'Large', large:'Large',
    xl:'XL', xxl:'XXL'
  };
  const key = String(value || '').trim().toLowerCase();
  return labels[key] || value || '';
}

const SECTIONS = [
  {
    title:'Coat', icon:'🧥',
    meta:[
      ['Serial Number','coat_serial_number'],
      ['Date of Manufacture','coat_date_of_manufacture','date']
    ],
    checks:[

      ['Rips / Tears / Etc.','coat_ripstearsetc_shell','coat_ripstearsetc_liner'],

      ['Seams / Stitching','coat_seams_stitching_shell','coat_seams_stitching_liner'],

      ['DRD Cleanliness','coat_drd_cleanliness',null],

  },
  {

      ['Date of Manufacture','pants_date_of_manufacture','date']
    ],
    checks:[

      ['Rips / Tears / Etc.','pants_rips_tears_etc_shell','pants_rips_tears_etc_liner'],
      ['Heat / Flame Damage','pants_heat_shell','pants_heat_liner'],
      ['Seams / Stitching','pants_seams_shell','pants_seams_liner'],
      ['Fabric Integrity','pants_fabric_integity_shell','pants_fabric_integity_liner'],
      ['Reflective Trim','pants_reflective_trim',null],
      ['Label Integrity','pants_label_integrity_shell','pants_label_integrity_liner'],
      ['Liner Attachment','pants_liner_attachment_shell','pants_liner_attachment_liner'],
      ['Closure Function','pants_closure_function_shell','pants_closure_function_liner'],
      ['Closure Hardware','pants_closure_hardware_shell','pants_closure_hardware_liner'],
      ['DRD Cleanliness','pants_drd_cleanliness_shell','pants_drd_cleanliness_liner'],
      ['DRD Integrity','pants_drd_integrity_shell','pants_drd_integrity_liner'],
      ['Assembled Properly','pants_assembled_properly_shell','pants_assembled_properly_liner'],

  {

    showWhen:a => val(a,'hood_source') === 'issued' || hasAny(a, ['tan_hood_mfg','tan_hood_size','tan_hood_cleanliness','blue_hood_mfg','blue_hood_size','blue_hood_cleanliness']),
    meta:[
      ['Hood Source','hood_source','source'],
      ['Tan Hood MFG','tan_hood_mfg','date'],
      ['Tan Hood Size','tan_hood_size','size'],
      ['Blue Hood MFG','blue_hood_mfg','date'],

    ],
    checks:[

    ],

  },
  {

    ],
    checks:[

      ['Rips / Tears / Etc.','issued_fire_gloves_rip_tears_etc',null],
      ['Flame / Heat Damage','issued_fire_gloves_flame_heat_damage',null],
      ['Seams / Stitching','issued_fire_gloves_seems_stitching',null],
      ['Elasticity','issued_fire_gloves_elasticity',null],
      ['Flexibility','issued_fire_gloves_flexibility',null]
    ],
    comments:'issued_fire_gloves_comments_long'
  },

function hasAny(a, fields) {
  return fields.some(field => val(a, field) !== '');
}
function sectionHasAnyData(a, section) {
  const metaFields = (section.meta || []).map(m => m[1]);
  const checkFields = (section.checks || []).flatMap(c => [c[1], c[2]]).filter(Boolean);
  const commentFields = Array.isArray(section.comments) ? section.comments : [section.comments].filter(Boolean);
  return hasAny(a, metaFields.concat(checkFields, commentFields));
}
function renderMetaValue(a, field, type) {
  if (type === 'date') return getDate(a, field) || '—';
  if (type === 'source') return prettySource(val(a, field)) || '—';
  if (type === 'size') return sizeLabel(val(a, field)) || '—';
  return displayVal(a, field);
}
function renderComments(a, comments) {
  const fields = Array.isArray(comments) ? comments : [comments].filter(Boolean);
  const values = fields.map(field => val(a, field)).filter(Boolean);
  if (!values.length) return '';
  return '<div class="note-box"><div class="fl">Comments</div><div class="fv long">' + escapeHTML(values.join('\n\n')) + '</div></div>';
}
function renderSection(a, section) {
  if (section.showWhen && !section.showWhen(a)) return '';
  if (!section.showWhen && !sectionHasAnyData(a, section)) return '';

  const answered = section.checks.reduce((sum, row) => sum + (val(a, row[1]) ? 1 : 0) + (row[2] && val(a, row[2]) ? 1 : 0), 0);
  const meta = (section.meta || []).map(item => {
    return '<div class="field"><div class="fl">' + escapeHTML(item[0]) + '</div><div class="fv">' + escapeHTML(renderMetaValue(a, item[1], item[2])) + '</div></div>';
  }).join('');

  const rows = section.checks.map(row => {
    const label = row[0];
    const shellField = row[1];
    const linerField = row[2];
    const shell = val(a, shellField);
    const liner = linerField ? val(a, linerField) : null;
    return '<tr>' +
      '<td>' + escapeHTML(label) + '</td>' +
      '<td class="c">' + passFailPill(shell) + '</td>' +
      '<td class="c">' + (linerField ? passFailPill(liner) : '<span class="muted">N/A</span>') + '</td>' +
      '</tr>';
  }).join('');

  return '<div class="card">' +
    '<div class="card-head"><div class="card-head-left"><span class="ico">' + section.icon + '</span><h2>' + escapeHTML(section.title) + '</h2></div><div class="card-count">' + answered + ' answered</div></div>' +
    '<div class="card-body">' +
      (meta ? '<div class="asset-meta">' + meta + '</div>' : '') +
      '<table class="inspection-table"><thead><tr><th>Inspection Item</th><th class="c" style="width:110px;">Shell / Item</th><th class="c" style="width:110px;">Liner</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      renderComments(a, section.comments) +
    '</div>' +
  '</div>';
}
function updateSummary(a) {
  let pass = 0;
  let fail = 0;
  SECTIONS.forEach(section => {
    section.checks.forEach(row => {
      [row[1], row[2]].filter(Boolean).forEach(field => {
        const v = String(val(a, field)).toLowerCase().trim();
        if (v === 'pass') pass++;
        if (v === 'fail') fail++;
      });
    });
  });
  document.getElementById('summary-pass').textContent = pass;
  document.getElementById('summary-fail').textContent = fail;
  document.getElementById('summary-total').textContent = pass + fail;
}
function populateDetails(a) {
  setText('f-name', a.name);
  setText('f-inspector', a.inspector_name || a.inspector_name_signature);
  setText('f-date', a.formatted_date || fmtDate(a.date_of_inspection));
  setText('f-email', a.email);
  setText('f-signature', a.inspector_name_signature);

  document.getElementById('doc-meta').innerHTML =
    '<div>' + escapeHTML(a.name || '') + '</div>' +
    '<div>' + escapeHTML(a.formatted_date || fmtDate(a.date_of_inspection) || '') + '</div>' +
    '<div style="font-size:10px;opacity:.55;margin-top:2px;">OID ' + escapeHTML(a.objectid || '') + '</div>';
}

// --- Attachments ---

function fileIconFor(contentType, name) {
  const ct = (contentType || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (ct.includes('pdf') || n.endsWith('.pdf')) return '📕';
  if (ct.startsWith('video/')) return '🎬';
  if (ct.startsWith('audio/')) return '🎵';
  if (n.endsWith('.doc') || n.endsWith('.docx')) return '📝';
  if (n.endsWith('.xls') || n.endsWith('.xlsx')) return '📊';
  return '📄';
}

function renderAttachments(objectId, infos) {
  const card = document.getElementById('attachments-card');
  const grid = document.getElementById('f-attachments');
  if (!card || !grid) return;

  if (!infos || !infos.length) {
    return; // keep card hidden
  }

  grid.innerHTML = infos.map(att => {
    const href = PARENT_LAYER + '/' + objectId + '/attachments/' + att.id;
    const contentType = att.contentType || '';
    const name = att.name || ('Attachment ' + att.id);
    const isImage = contentType.toLowerCase().startsWith('image/');

    const thumb = isImage
      ? '<img class="attach-thumb" src="' + href + '" alt="' + escapeHTML(name) + '" loading="lazy">'
      : '<div class="attach-icon">' + fileIconFor(contentType, name) + '</div>';

    const sizeKB = att.size ? Math.round(att.size / 1024) + ' KB' : '';

    return '<a class="attach-item" href="' + href + '" target="_blank" rel="noopener noreferrer">' +
      thumb +
      '<div class="attach-name">' + escapeHTML(name) + '</div>' +
      (sizeKB ? '<div class="attach-meta">' + escapeHTML(sizeKB) + '</div>' : '') +
      '</a>';
  }).join('');

  card.style.display = '';
}

async function loadAttachments(objectId) {
  if (!objectId) return;

  try {
    const url = PARENT_LAYER + '/' + objectId + '/attachments?f=json';
    const data = await fetch(url).then(r => r.json());

    if (data.error) throw new Error(data.error.message || 'Error loading attachments');

    renderAttachments(objectId, data.attachmentInfos || []);
  } catch (e) {
    console.error('Attachments error:', e);
    // Fail silently on the printed form — missing attachments shouldn't block the rest of the inspection.
  }
}

function populateFromParams() {
  const a = {
    name:p.get('name') || '',
    inspector_name:p.get('inspector') || '',
    formatted_date:p.get('date') || '',
    email:p.get('email') || '',
    inspector_name_signature:p.get('signature') || '',
    objectid:p.get('oid') || ''
  };
  populateDetails(a);
  updateSummary(a);
  document.getElementById('inspection-sections').innerHTML = '<div class="card"><div class="card-body"><div class="err">No GlobalID was provided, so the full inspection fields could not be loaded from ArcGIS.</div></div></div>';

  if (a.objectid) loadAttachments(a.objectid);
}
async function loadParent() {
  if (!gid) {
    populateFromParams();
    return;
  }

  try {
    const url = PARENT_LAYER + '/query?where=globalid%3D%27' + encodeURIComponent(gid) + '%27&outFields=*&f=json';
    const data = await fetch(url).then(r => r.json());
    if (data.error) throw new Error(data.error.message);
    if (!data.features || !data.features.length) throw new Error('No inspection record found for this GlobalID.');

    const a = data.features[0].attributes;
    populateDetails(a);
    updateSummary(a);

    const html = SECTIONS.map(section => renderSection(a, section)).filter(Boolean).join('');
    document.getElementById('inspection-sections').innerHTML = html || '<div class="card"><div class="card-body"><div class="muted">No inspection sections had entered values.</div></div></div>';

    if (a.objectid) loadAttachments(a.objectid);
  } catch (e) {
    console.error(e);
    document.getElementById('inspection-sections').innerHTML = '<div class="card"><div class="card-body"><div class="err">Could not load inspection: ' + escapeHTML(e.message) + '</div></div></div>';
    populateFromParams();
  }
}
function copyLink() {
  const btn = document.getElementById('btn-copy');
  navigator.clipboard.writeText(window.location.href).then(() => {
    btn.textContent = '✓ Copied!';
    btn.style.background = '#2d7a2d';
    setTimeout(() => {
      btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Link';
      btn.style.background = '';
    }, 2000);
  });
}
