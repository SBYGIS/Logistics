<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Order - SFD</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --red:#b81c1c;
    --red-dark:#8f1212;
    --red-light:#fff2f2;
    --grey:#3d3d3d;
    --grey-light:#f4f4f4;
    --rule:#ddd;
    --text:#1e1e1e;
    --muted:#777;
    --white:#ffffff;
    --bg:#e8e8e8;
    --gold:#c8a84b;
  }

  body {
    font-family:'DM Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:32px 20px 100px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .page {
    width:100%;
    max-width:900px;
  }

  .doc-header {
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
    background:linear-gradient(135deg,#6b0f0f 0%,var(--red-dark) 50%,#6b0f0f 100%);
    border-radius:12px;
    padding:18px 24px;
    color:var(--white);
    border:2px solid rgba(200,168,75,.35);
    box-shadow:0 4px 24px rgba(143,18,18,.35);
  }

  .logo-wrap {
    width:72px;
    height:72px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-wrap img {
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .doc-header-text {
    flex:1;
  }

  .agency {
    font-size:10px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:3px;
  }

  .doc-title {
    font-size:24px;
    font-weight:700;
    color:var(--white);
    line-height:1.1;
  }

  .doc-subtitle {
    font-size:11px;
    color:rgba(255,255,255,.60);
    margin-top:2px;
    letter-spacing:.04em;
  }

  .doc-meta {
    font-family:'DM Mono',monospace;
    font-size:11px;
    color:rgba(255,255,255,.70);
    text-align:right;
    line-height:1.9;
    flex-shrink:0;
  }

  .card {
    background:var(--white);
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    margin-bottom:14px;
    border:1px solid var(--rule);
    overflow:hidden;
  }

  .card-head {
    background:var(--grey);
    color:var(--white);
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-left:4px solid var(--red);
  }

  .card-head-left {
    display:flex;
    align-items:center;
    gap:10px;
  }

  .card-head .ico {
    font-size:15px;
  }

  .card-head h2 {
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .card-body {
    padding:16px 20px;
  }

  .fields {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 22px;
  }

  .field {
    padding:10px 0;
    border-bottom:1px solid #eee;
  }

  .field.full {
    grid-column:1/-1;
  }

  .fl {
    font-size:9px;
    font-weight:700;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }

  .fv {
    font-size:13px;
    font-weight:500;
    color:var(--text);
    min-height:18px;
  }

  .fv.long {
    font-weight:400;
    line-height:1.55;
    white-space:pre-wrap;
  }

  .badge {
    display:inline-block;
    border-radius:999px;
    padding:4px 10px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--red);
    background:var(--red-light);
    border:1px solid #f0b3b3;
  }

  .badge-dark {
    color:#245b89;
    background:#eef6ff;
    border-color:#b9d7f3;
  }

  .oos-alert {
    display:none;
    background:#fff2f2;
    border:1px solid #f0b3b3;
    border-left:4px solid var(--red);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:14px;
    color:var(--red-dark);
    font-size:13px;
    font-weight:700;
  }

  .status-wrap {
    padding:4px 20px 18px;
    border-top:1px solid #eee;
  }

  .status-wrap .fl {
    margin-bottom:8px;
  }

  .sbar {
    display:flex;
    gap:3px;
    margin-bottom:5px;
  }

  .seg {
    flex:1;
    height:13px;
    border-radius:3px;
    background:#e5e5e5;
  }

  .seg.active-seg {
    box-shadow:0 3px 8px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.2);
    transform:scaleY(1.1);
    transform-origin:bottom;
  }

  .snames {
    display:flex;
    gap:3px;
  }

  .sname {
    flex:1;
    font-size:8px;
    text-align:center;
    color:var(--muted);
    font-weight:500;
    line-height:1.15;
  }

  .sname.active {
    color:var(--text);
    font-weight:800;
  }

  .status-current {
    font-size:12px;
    font-weight:700;
    color:var(--text);
    margin-top:8px;
  }

  /* Attachments */
  .attach-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
  }

  .attach-item {
    display:flex;
    flex-direction:column;
    border:1px solid var(--rule);
    border-radius:8px;
    overflow:hidden;
    text-decoration:none;
    color:var(--text);
    background:var(--grey-light);
    transition:box-shadow .15s, transform .1s;
  }

  .attach-item:hover {
    box-shadow:0 4px 14px rgba(0,0,0,.14);
    transform:translateY(-1px);
  }

  .attach-thumb {
    width:100%;
    height:100px;
    object-fit:cover;
    background:#e2e2e2;
    display:block;
  }

  .attach-icon {
    width:100%;
    height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:#e2e2e2;
  }

  .attach-name {
    font-size:11px;
    font-weight:500;
    padding:6px 8px;
    word-break:break-word;
    line-height:1.3;
  }

  .attach-meta {
    font-size:10px;
    color:var(--muted);
    padding:0 8px 8px;
  }

  .attach-empty {
    font-size:12px;
    color:var(--muted);
  }

  .print-bar {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--white);
    border-top:1px solid var(--rule);
    padding:11px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    z-index:100;
    box-shadow:0 -4px 16px rgba(0,0,0,.08);
  }

  .btn-print,
  .btn-copy {
    color:var(--white);
    border:none;
    border-radius:7px;
    padding:10px 20px;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s, transform .1s;
  }

  .btn-print {
    background:var(--red);
    padding-left:28px;
    padding-right:28px;
  }

  .btn-copy {
    background:var(--grey);
  }

  .btn-print:hover {
    background:var(--red-dark);
  }

  .btn-copy:hover {
    background:#555;
  }

  .btn-print:active,
  .btn-copy:active {
    transform:scale(.97);
  }

  .err {
    padding:14px;
    color:#c0392b;
    font-size:13px;
    background:#fff5f5;
    border:1px solid #ffd7d7;
    border-radius:8px;
  }

  .hidden {
    display:none !important;
  }

  @media (max-width:760px) {
    body {
      padding:18px 12px 96px;
    }

    .doc-header {
      align-items:flex-start;
      padding:16px;
    }

    .logo-wrap {
      width:56px;
      height:56px;
    }

    .doc-meta {
      display:none;
    }

    .fields {
      grid-template-columns:1fr;
    }
  }

  @media print {
    body {
      background:white;
      padding:0;
    }

    .print-bar {
      display:none;
    }

    .card {
      box-shadow:none;
      border-radius:6px;
      page-break-inside:avoid;
    }

    .page {
      max-width:100%;
    }

    * {
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }

    .card-head {
      background:var(--grey) !important;
      color:white !important;
    }

    .doc-header {
      background:#8f1212 !important;
    }
  }
</style>
</head>

<body>
<div class="page">

  <div class="doc-header">
    <div class="logo-wrap">
      <img src="https://salisbury.maps.arcgis.com/sharing/rest/content/items/33492bb1f8584dca9449da8c155f936a/data" alt="Salisbury Fire Department">
    </div>
    <div class="doc-header-text">
      <div class="agency">City of Salisbury · Est. 1872</div>
      <div class="doc-title">Work Order</div>
      <div class="doc-subtitle">Salisbury Fire Department</div>
    </div>
    <div class="doc-meta" id="doc-meta"></div>
  </div>

  <div class="oos-alert" id="oos-alert">
    ⚠️ Equipment marked out of service
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-head-left"><span class="ico">📋</span><h2>Work Order Details</h2></div>
    </div>
    <div class="card-body">
      <div class="fields">
        <div class="field">
          <div class="fl">Date</div>
          <div class="fv" id="f-date">-</div>
        </div>
        <div class="field">
          <div class="fl">Staff Submitting</div>
          <div class="fv" id="f-staff">-</div>
        </div>
        <div class="field">
          <div class="fl">Email</div>
          <div class="fv" id="f-email">-</div>
        </div>
        <div class="field">
          <div class="fl">Work Order Type</div>
          <div class="fv" id="f-type">-</div>
        </div>
        <div class="field">
          <div class="fl">Station</div>
          <div class="fv" id="f-station">-</div>
        </div>
        <div class="field">
          <div class="fl">Unit</div>
          <div class="fv" id="f-unit">-</div>
        </div>
        <div class="field">
          <div class="fl">Equipment / Item</div>
          <div class="fv" id="f-equipment">-</div>
        </div>
