<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilities Inspection - SFD</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --red:#b81c1c;
    --red-dark:#8f1212;
    --grey:#3d3d3d;
    --grey-light:#f4f4f4;
    --rule:#ddd;
    --text:#1e1e1e;
    --muted:#777;
    --white:#ffffff;
    --bg:#e8e8e8;
    --gold:#c8a84b;
  }

  body {
    font-family:'DM Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:32px 20px 100px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .page {
    width:100%;
    max-width:900px;
  }

  .doc-header {
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
    background:linear-gradient(135deg,#6b0f0f 0%,var(--red-dark) 50%,#6b0f0f 100%);
    border-radius:12px;
    padding:18px 24px;
    color:var(--white);
    border:2px solid rgba(200,168,75,.35);
    box-shadow:0 4px 24px rgba(143,18,18,.35);
  }

  .logo-wrap {
    width:72px;
    height:72px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-wrap img {
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .doc-header-text {
    flex:1;
  }

  .agency {
    font-size:10px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:3px;
  }

  .doc-title {
    font-size:24px;
    font-weight:700;
    color:var(--white);
    line-height:1.1;
  }

  .doc-subtitle {
    font-size:11px;
    color:rgba(255,255,255,.60);
    margin-top:2px;
    letter-spacing:.04em;
  }

  .doc-meta {
    font-family:'DM Mono',monospace;
    font-size:11px;
    color:rgba(255,255,255,.70);
    text-align:right;
    line-height:1.9;
    flex-shrink:0;
  }

  .card {
    background:var(--white);
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    margin-bottom:14px;
    border:1px solid var(--rule);
    overflow:hidden;
  }

  .card-head {
    background:var(--grey);
    color:var(--white);
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-left:4px solid var(--red);
  }

  .card-head-left {
    display:flex;
    align-items:center;
    gap:10px;
  }

  .card-head .ico {
    font-size:15px;
  }

  .card-head h2 {
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  .card-count {
    font-family:'DM Mono',monospace;
    font-size:10px;
    color:rgba(255,255,255,.75);
  }

  .card-body {
    padding:16px 20px;
  }

  .fields {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 22px;
  }

  .field {
    padding:10px 0;
    border-bottom:1px solid #eee;
  }

  .field.full {
    grid-column:1/-1;
  }

  .fl {
    font-size:9px;
    font-weight:700;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }

  .fv {
    font-size:13px;
    font-weight:500;
    color:var(--text);
    min-height:18px;
  }

  .station-badge {
    display:inline-block;
    border-radius:999px;
    padding:4px 10px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--red);
    background:#fff2f2;
    border:1px solid #f0b3b3;
  }

  .inspection-table {
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }

  .inspection-table thead tr {
    background:var(--grey-light);
    border-bottom:2px solid var(--rule);
  }

  .inspection-table th {
    padding:9px 12px;
    text-align:left;
    font-size:9px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .inspection-table tbody tr {
    border-bottom:1px solid #eee;
  }

  .inspection-table tbody tr:last-child {
    border-bottom:none;
  }

  .inspection-table td {
    padding:10px 12px;
    color:var(--text);
    vertical-align:top;
  }

  .inspection-table td.area {
    width:36%;
    font-weight:700;
  }

  .inspection-table td.notes {
    white-space:pre-wrap;
    line-height:1.45;
  }

  .loading {
    padding:24px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  .loading .spinner {
    width:20px;
    height:20px;
    border:2px solid #ddd;
    border-top-color:var(--red);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
    margin-bottom:8px;
  }

  @keyframes spin {
    to { transform:rotate(360deg); }
  }

  .err {
    padding:14px;
    color:#c0392b;
    font-size:13px;
    background:#fff5f5;
    border:1px solid #ffd7d7;
    border-radius:8px;
  }

  .print-bar {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--white);
    border-top:1px solid var(--rule);
    padding:11px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    z-index:100;
    box-shadow:0 -4px 16px rgba(0,0,0,.08);
  }

  .btn-print,
  .btn-copy {
    color:var(--white);
    border:none;
    border-radius:7px;
    padding:10px 20px;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s, transform .1s;
  }

  .btn-print {
    background:var(--red);
    padding-left:28px;
    padding-right:28px;
  }

  .btn-copy {
    background:var(--grey);
  }

  .btn-print:hover {
    background:var(--red-dark);
  }

  .btn-copy:hover {
    background:#555;
  }

  .btn-print:active,
  .btn-copy:active {
    transform:scale(.97);
  }

  @media (max-width:760px) {
    body {
      padding:18px 12px 96px;
    }

    .doc-header {
      align-items:flex-start;
      padding:16px;
    }

    .logo-wrap {
      width:56px;
      height:56px;
    }

    .doc-meta {
      display:none;
    }

    .fields {
      grid-template-columns:1fr;
    }

    .inspection-table td.area {
      width:auto;
    }
  }

  @media print {
    body {
      background:white;
      padding:0;
    }

    .print-bar {
      display:none;
    }

    .card {
      box-shadow:none;
      border-radius:6px;
      page-break-inside:avoid;
    }

    .page {
      max-width:100%;
    }

    * {
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }

    .card-head {
      background:var(--grey) !important;
      color:white !important;
    }

    .doc-header {
      background:#8f1212 !important;
    }
  }
</style>
</head>

<body>
<div class="page">

  <div class="doc-header">
    <div class="logo-wrap">
      <img src="https://salisbury.maps.arcgis.com/sharing/rest/content/items/33492bb1f8584dca9449da8c155f936a/data" alt="Salisbury Fire Department">
    </div>
    <div class="doc-header-text">
      <div class="agency">City of Salisbury · Est. 1872</div>
      <div class="doc-title">Facilities Inspection</div>
      <div class="doc-subtitle">Salisbury Fire Department</div>
    </div>
    <div class="doc-meta" id="doc-meta"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-head-left"><span class="ico">📋</span><h2>Inspection Details</h2></div>
    </div>
    <div class="card-body">
      <div class="fields">
        <div class="field">
          <div class="fl">Station</div>

      </div>
    </div>
  </div>

  <div id="station-section">
    <div class="card">
      <div class="loading"><div class="spinner"></div><br>Loading inspection...</div>

</div>

<div class="print-bar">
  <button class="btn-copy" id="btn-copy" onclick="copyLink()">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
    </svg>
    Copy Link
  </button>
  <button class="btn-print" onclick="window.print()">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8" rx="1"/>
      <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
    </svg>
    Print / Save PDF
  </button>
</div>

<script>
const PRINT_URL = 'https://sbygis.github.io/Logistics/FacilitiesInspection.html';
const BASE = 'https://services6.arcgis.com/Hx8jJ6McXQ0jnqLk/arcgis/rest/services/SFD_Facilities_Inspection_Editor_View/FeatureServer';
const PARENT_LAYER = BASE + '/0';

const p = new URLSearchParams(window.location.search);
const gid = p.get('globalid');

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function value(a, field) {
  const v = a ? a[field] : null;
  return v != null && String(v).trim() !== '' ? v : '';
}

function firstValue(a, fields) {
  for (const field of fields) {
    const v = value(a, field);
    if (v) return v;
  }
  return '';
}

function setText(id, val, fallback) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = val != null && String(val).trim() !== '' ? val : (fallback || '-');
}

function fmtDate(epoch) {
  if (!epoch) return '';
  const d = new Date(epoch);
  if (isNaN(d.getTime())) return String(epoch);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function displayDate(value) {
  if (!value) return '';
  if (isNaN(Number(value))) return String(value);
  return fmtDate(value);
}

function selectedStationKey(station) {
  const s = String(station || '').toLowerCase();

  if (s.indexOf('16') > -1) return 'station16';
  if (s.indexOf('2') > -1) return 'station2';
  if (s.indexOf('admin') > -1 || s.indexOf('administrative') > -1) return 'admin';
  if (s.indexOf('1') > -1) return 'station1';

  return '';
}

const STATION_CONFIG = {
  station1: {
    title: 'Station 1 Inspection Notes',
    icon: '🏢',
    dateFields: ['inspection_date', 'station_1_date'],
    assistantFields: ['assistant_chief', 'station_1_assistant_chief'],
    deputyFields: ['deputy_chief', 'station_1_deputy_chief'],
    areas: [
      ['Front Apparatus Bay', ['station1_front_apparatus_bay_long', 'station1_front_apparatus_bay']],
      ['Rear Apparatus Bay', ['station1_rear_apparatus_bay_long', 'station1_rear_apparatus_bay']],
      ['Kitchen', ['station1_kitchen_long', 'station1_kitchen']],
      ['Meeting Room', ['station1_meeting_room_long', 'station1_meeting_room']],
      ['Laundry & Mechanical Room', ['station1_laundry_mechanical_room_long', 'station1_laundry_mechanical_room']],
      ['Radio Room', ['station1_radio_room_long', 'station1_radio_room']],
      ['Dormitory', ['station1_dormitory_long', 'station1_dormitory']],
      ['Restrooms', ['station1_restrooms_long', 'station1_restrooms']],
      ['Office', ['station1_office_long', 'station1_office']],
      ['Annex Building', ['station1_annex_building_long', 'station1_annex_building']],
      ['Side Alpha', ['station1_side_alpha_long', 'station1_side_alpha']],
      ['Side Bravo', ['station1_side_bravo_long', 'station1_side_bravo']],
      ['Side Charlie', ['station1_side_charlie_long', 'station1_side_charlie']],
      ['Side Delta', ['station1_side_delta_long', 'station1_side_delta']]
    ]
  },

  station2: {
    title: 'Station 2 Inspection Notes',
    icon: '🏢',
    dateFields: ['inspection_date', 'station_2_date'],
    assistantFields: ['assistant_chief', 'station_2_assistant_chief'],
    deputyFields: ['deputy_chief', 'station_2_deputy_chief'],
    areas: [
      ['Apparatus Bay', ['station2_apparatus_bay_long', 'station2_apparatus_bay']],
      ['Radio Room', ['station2_radio_room_long', 'station2_radio_room']],
      ['Hallway & Computer Room', ['station2_hallway_computer_room_long', 'station2_hallway_computer_room']],
      ['Restrooms', ['station2_restrooms_long', 'station2_restrooms']],
      ['Laundry & Mechanical Room', ['station2_laundry_mechanical_room_long', 'station2_laundry_mechanical_room']],
      ['Lounge', ['station2_lounge_long', 'station2_lounge']],
      ['Kitchen', ['station2_kitchen_long', 'station2_kitchen']],
      ['Front Bay', ['station2_front_bay_long', 'station2_front_bay']],
      ['Meeting Room', ['station2_meeting_room_long', 'station2_meeting_room']],
      ['Upstairs Bathroom', ['station2_upstairs_bathroom_long', 'station2_upstairs_bathroom']],
      ['Office Area', ['station2_office_area_long', 'station2_office_area']],
      ['Side Alpha', ['station2_side_alpha_long', 'station2_side_alpha']],
      ['Side Bravo', ['station2_side_bravo_long', 'station2_side_bravo']],
      ['Side Charlie', ['station2_side_charlie_long', 'station2_side_charlie']],
      ['Side Delta', ['station2_side_delta_long', 'station2_side_delta']]
    ]
  },

  station16: {
    title: 'Station 16 Inspection Notes',
    icon: '🏢',
    dateFields: ['inspection_date', 'station_16_date'],
    assistantFields: ['assistant_chief', 'station_16_assistant_chief'],
    deputyFields: ['deputy_chief', 'station_16_deputy_chief'],
    areas: [
      ['Apparatus Bay', ['station16_apparatus_bay_long', 'station16_apparatus_bay']],
      ['Apparatus Bay Cleaning Room', ['station16_apparatus_bay_cleaning_long', 'station16_apparatus_bay_cleaning']],
      ['Mechanical Mezzanine', ['station16_mechanical_mezzanine_long', 'station16_mechanical_mezzanine']],
      ['Turnout Gear Room', ['station16_turnout_gear_room_long', 'station16_turnout_gear_room']],
      ['SCBA Repair Room', ['station16_scba_repair_room_long', 'station16_scba_repair_room']],
      ['Maintenance Shop', ['station16_maintenance_shop_long', 'station16_maintenance_shop']],
      ['Alarm Room', ['station16_alarm_room_long', 'station16_alarm_room']],
      ['Conference Room', ['station16_conference_room_long', 'station16_conference_room']],
      ['Janitor Closet Room #145', ['station16_janitor_closet_long', 'station16_janitor_closet']],
      ['Restroom Room #146', ['station16_restroom_146_long', 'station16_restroom_146']],
      ['Decontaminated Room', ['station16_decontaminated_room_long', 'station16_decontaminated_room']],
      ['Janitor Closet Room #158', ['station16_janitor_closet_158_long', 'station16_janitor_closet_158']],
      ['Dormitory', ['station16_dormitory_long', 'station16_dormitory']],
      ['Linen Room', ['station16_linen_room_long', 'station16_linen_room']],
      ['Laundry Room', ['station16_laundry_room_long', 'station16_laundry_room']],
      ['Fitness Room', ['station16_fitness_room_long', 'station16_fitness_room']],
      ['Locker Room', ['station16_locker_room_long', 'station16_locker_room']],
      ['Restrooms Room #166-171', ['station16_restrooms_166_171_long', 'station16_restrooms_166_171']],
      ['Kitchen & Dining Room', ['station16_kitchen_dining_long', 'station16_kitchen_dining']],
      ['Patio', ['station16_patio_long', 'station16_patio']],
      ['Day Room', ['station16_day_room_long', 'station16_day_room']],
      ['Training Mezzanine', ['station16_training_mezzanine_long', 'station16_training_mezzanine']],
      ['Mechanical Room', ['station16_mechanical_room_long', 'station16_mechanical_room']],
      ['Training Tower', ['station16_training_tower_long', 'station16_training_tower']],
      ['Extrication/Roof Prop Area', ['station16_extrication_roof_prop_long', 'station16_extrication_roof_prop']],
      ['Dumpster Area', ['station16_dumpster_area_long', 'station16_dumpster_area']],
      ['Side Alpha', ['station16_side_alpha_long', 'station16_side_alpha']],
      ['Side Bravo', ['station16_side_bravo_long', 'station16_side_bravo']],
      ['Side Charlie', ['station16_side_charlie_long', 'station16_side_charlie']],
      ['Side Delta', ['station16_side_delta_long', 'station16_side_delta']]
    ]
  },

  admin: {
    title: 'Administrative Building Inspection Notes',
    icon: '🏢',
    dateFields: ['inspection_date', 'station_administrative_date'],
    assistantFields: ['assistant_chief', 'administrative_assistant_chief'],
    deputyFields: ['deputy_chief', 'administrative_deputy_chief'],
    areas: [
      ['Vestibule', ['admin_vestibule_long', 'admin_vestibule']],
      ['Heritage Center', ['admin_heritage_center_long', 'admin_heritage_center']],
      ['Training Room', ['admin_training_room_long', 'admin_training_room']],
      ['Chair Storage', ['admin_chair_storage_long', 'admin_chair_storage']],
      ['Training Storage', ['admin_training_storage_long', 'admin_training_storage']],
      ['Audio/Video Storage', ['admin_audio_video_storage_long', 'admin_audio_video_storage']],
      ['Waiting Area', ['admin_waiting_area_long', 'admin_waiting_area']],
      ['Public Restrooms', ['admin_public_restrooms_long', 'admin_public_restrooms']],
      ['Work Room', ['admin_work_room_long', 'admin_work_room']],
      ['Conference Room', ['admin_conference_room_long', 'admin_conference_room']],
      ['Office Spaces', ['admin_office_spaces_long', 'admin_office_spaces']],
      ['Kitchenette & Hallways', ['admin_kitchenette_hallways_long', 'admin_kitchenette_hallways']],
      ['Restrooms', ['admin_restrooms_long', 'admin_restrooms']],
      ['Maintenance & Supply', ['admin_maintenance_supply_long', 'admin_maintenance_supply']]
    ]
  }
};

function renderRows(a, areas) {
  return areas.map(item => {
    const label = item[0];
    const fields = item[1];
    const note = firstValue(a, fields) || '-';

    return '<tr>' +
      '<td class="area">' + escapeHTML(label) + '</td>' +
      '<td class="notes">' + escapeHTML(note) + '</td>' +
    '</tr>';
  }).join('');
}

function countEnteredNotes(a, areas) {
  let count = 0;

  areas.forEach(item => {
    if (firstValue(a, item[1])) count++;
  });

  return count;
}

function populateDetails(a) {
  const station = value(a, 'station_select');
  const key = selectedStationKey(station);
  const cfg = STATION_CONFIG[key];

  const dateRaw = cfg ? firstValue(a, ['formatted_date'].concat(cfg.dateFields)) : firstValue(a, ['formatted_date', 'inspection_date']);
  const finalDate = displayDate(dateRaw);
  const assistantChief = cfg ? firstValue(a, cfg.assistantFields) : value(a, 'assistant_chief');
  const deputyChief = cfg ? firstValue(a, cfg.deputyFields) : value(a, 'deputy_chief');

  document.getElementById('f-station').innerHTML = '<span class="station-badge">' + escapeHTML(station || '-') + '</span>';
  setText('f-date', finalDate);
  setText('f-assistant-chief', assistantChief);
  setText('f-deputy-chief', deputyChief);

  document.getElementById('doc-meta').innerHTML =
    '<div>' + escapeHTML(station || '') + '</div>' +
    '<div>' + escapeHTML(finalDate || '') + '</div>' +
    '<div style="font-size:10px;opacity:.55;margin-top:2px;">OID ' + escapeHTML(a.objectid || '') + '</div>';

  if (!cfg) {
    document.getElementById('station-section').innerHTML =
      '<div class="card"><div class="card-body"><div class="err">Could not determine which station section to show from station_select.</div></div></div>';
    return;
  }

  const entered = countEnteredNotes(a, cfg.areas);
  const rows = renderRows(a, cfg.areas);

  document.getElementById('station-section').innerHTML =
    '<div class="card">' +
      '<div class="card-head">' +
        '<div class="card-head-left"><span class="ico">' + cfg.icon + '</span><h2>' + escapeHTML(cfg.title) + '</h2></div>' +
        '<div class="card-count">' + entered + ' notes entered</div>' +
      '</div>' +
      '<div>' +
        '<table class="inspection-table">' +
          '<thead><tr><th>Area</th><th>Notes</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
}

function populateFromParams() {
  const a = {
    station_select:p.get('station') || '',
    formatted_date:p.get('date') || '',
    assistant_chief:p.get('assistant') || '',
    deputy_chief:p.get('deputy') || '',
    objectid:p.get('oid') || ''
  };

  populateDetails(a);
}

async function loadParent() {
  if (!gid) {
    populateFromParams();
    return;
  }

  try {
    const url = PARENT_LAYER + '/query?where=globalid%3D%27' + encodeURIComponent(gid) + '%27&outFields=*&returnGeometry=false&f=json';
    const data = await fetch(url).then(r => r.json());

    if (data.error) throw new Error(data.error.details ? data.error.details.join(' ') : data.error.message);
    if (!data.features || !data.features.length) throw new Error('No facilities inspection found for this GlobalID.');

    const a = data.features[0].attributes;
    populateDetails(a);
  } catch (e) {
    console.error(e);
    document.getElementById('station-section').innerHTML =
      '<div class="card"><div class="card-body"><div class="err">Could not load inspection: ' + escapeHTML(e.message) + '</div></div></div>';
    populateFromParams();
  }
}

function copyLink() {
  const btn = document.getElementById('btn-copy');

  navigator.clipboard.writeText(window.location.href).then(() => {
    btn.textContent = '✓ Copied!';
    btn.style.background = '#2d7a2d';

    setTimeout(() => {
      btn.innerHTML = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Link';
      btn.style.background = '';
    }, 2000);
  });
}

loadParent();
</script>
